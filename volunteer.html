<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Get Involved</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Headings -->
    <header class="site-header">
        <div clas="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/Hands of Hope Logo.jpg">
                </a>
            </div>

            <nav>
                <ul class="nav-menu">
                <li><a href="index.html">Home</a></li>
                <li><a href="help.html">Ask for help</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="volunteer.html" class="active">Get Involved</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
            </nav>
        </div>
    </header>

    <hr>

    <!-- Main Content Area -->
    <main class="main-container">
        <!-- Volunteer Sign-Up Section -->
        <section class="volunteer-layout">

            <div class="volunteer-form-container"></div>

            <h1>Volunteer Sign-Up Form</h1>
            <h2>Join our team of volunteers and make a difference in the community!</h2>
            <p>Please fill out the form below to sign up as a volunteer. We will contact you with more information.</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="vol-name">Full Name:</label><br>
                    <input type="text" id="vol-name" name="vol_name" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="vol-email">Email Address:</label><br>
                    <input type="email" id="vol-email" name="vol_email" placeholder="Enter your email address" required><br><br>
                </div>

                <div class="form-group">
                    <label for="vol-phone">Phone Number:</label><br>
                    <input type="tel" id="vol-phone" name="vol_phone" placeholder="Enter your phone number" required><br><br>
                </div>

                <div class="form-group">
                    <label for="role">Preferred Role:</label><br>
                    <select id="role" name="role">
                        <option value="pantry">Food Pantry Volunteer</option>
                        <option value="driver">Delivery Driver</option>
                        <option value="event">Packing and Sorting</option>
                        <option value="event">Admin Help</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit">Sign Up</button>
                </div>
            </form>
        </div>
        </section>

        <hr>

        <!-- Promotional Picture Section -->
        <div class="volunteer-image">
            <pictures>
                <source srcset="images/volunteer-image.webp" type="image/webp">
                <img src="images/volunteer-image.jpg" alt="Hands of Hope Volunteer Image">
            </pictures>
        </div>
    </main>

    <hr>

    <!-- Footer section -->
    <footer>
        <p>footer content here</p>
    </footer>
</body>
</html>
