<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Get Involved</title>
</head>
<body>
    <!-- Headings -->
    <header>
        <div class="logo">
            <img src="images/hands-of-hope-logo.png">
        </div>
        <!-- Navigation menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="help.html">Ask for help</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="volunteer.html">Get Involved</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <!-- Main Content Area -->
    <main>
        <!-- Volunteer Sign-Up Section -->
        <section class="volunteer-section">
            <h2>Volunteer Sign-Up Form</h2>
            <form action="#" method="post">
                <label for="vol-name">Full Name:</label><br>
                <input type="text" id="vol-name" name="vol_name" required><br><br>

                <label for="vol-email">Email Address:</label><br>
                <input type="email" id="vol-email" name="vol_email" required><br><br>

                <label for="vol-phone">Phone Number:</label><br>
                <input type="tel" id="vol-phone" name="vol_phone" required><br><br>

                <label for="role">Preferred Role:</label><br>
                <select id="role" name="role">
                    <option value="pantry">Food Pantry Volunteer</option>
                    <option value="driver">Delivery Driver</option>
                    <option value="event">General Helper</option>
                </select><br><br>

                <button type="submit">Sign Up</button>
            </form>
        </section>

        <hr>

        <!-- Promotional Picture Section -->
        <section class="volunteer-media">
            <h2>Join Our Community</h2>
            <p>Help us make a difference in our community by volunteering your time</p>
            <p>[Insert pictures of volunteers working together]</p>
        </section>
    </main>

    <hr>

    <!-- Footer section -->
    <footer>
        <p>footer content here</p>
    </footer>
</body>
</html>
