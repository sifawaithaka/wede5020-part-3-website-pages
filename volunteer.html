<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Get Involved</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/Hands of Hope Logo.jpg" alt="Hands of Hope Logo">
                </a>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="help.html">Ask for help</a></li>
                    <li><a href="donate.html">Donate</a></li>
                    <li><a href="volunteer.html" class="active">Get Involved</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="page-content">
        <section class="volunteer-layout">
            <!-- Volunteer Sign-Up Form -->
            <div class="volunteer-form-card">
                <h1>Volunteer Sign-Up Form</h1>
                <p class="section-subtitle">Join our team of volunteers and make a difference in the community!</p>

                <form action="#" method="post" class="volunteer-form">
                    <div class="form-group">
                        <label for="vol-name">Full Name:</label>
                        <input type="text" id="vol-name" name="vol_name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-group">
                        <label for="vol-email">Email Address:</label>
                        <input type="email" id="vol-email" name="vol_email" placeholder="Enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label for="vol-phone">Phone Number:</label>
                        <input type="tel" id="vol-phone" name="vol_phone" placeholder="Enter your phone number" required>
                    </div>

                    <div class="form-group">
                        <label for="role">Preferred Role:</label>
                        <select id="role" name="role">
                            <option value="pantry">Food Pantry Volunteer</option>
                            <option value="driver">Delivery Driver</option>
                            <option value="packing">Packing and Sorting</option>
                            <option value="admin">Admin Help</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Sign Up</button>
                </form>
            </div>

            <!-- Promotional Picture Section -->
            <div class="volunteer-image-card">
                <picture>
                    <source srcset="images/Volunteer.jpg" type="image/jpeg">
                    <img src="images/Volunteer.jpg" alt="Hands of Hope Volunteers joining hands">
                </picture>
            </div>
        </section>

        <!-- Image Gallery -->
        <section class="gallery-section">
            <h2>Our Community in Action</h2>
            <div class="gallery-grid">
                <div class="gallery-item">
                    <img src="images/Donations to be given out.jpg" alt="Packed donations ready to be given out" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Group of Volunteers.jpg" alt="Hands of Hope community volunteers" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Donations.jpg" alt="Volunteers packing resources" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Loading donations.jpg" alt="Donations waiting to be loaded into trucks" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Food bank.jpg" alt="Weekly food pantry distribution event" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Teaching kids.jpg" alt="Weekly food pantry distribution event" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Donations to be given out.jpg" alt="Weekly food pantry distribution event" class="lightbox-trigger">
                </div>
                <div class="gallery-item">
                    <img src="images/Volunteer with kids.jpg" alt="Weekly food pantry distribution event" class="lightbox-trigger">
                </div>
            </div>
        </section>
    </main>

    <div id="lightboxModal" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg" alt="Enlarged gallery view">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Hands of Hope. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>

</body>
</html>
