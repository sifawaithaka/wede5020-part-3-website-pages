<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Volunteer</title>
    <meta name="description" content="Join Hands of Hope as a volunteer and make a meaningful impact in the community.">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/Hands of Hope Logo.jpg" alt="Hands of Hope Logo">
                </a>
            </div>

            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="help.html">Help</a></li>
                    <li><a href="donate.html">Donate</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <section class="volunteer-layout">
            <div class="volunteer-form-card">
                <h1>Volunteer Sign-Up Form</h1>

                <form id="volunteerForm" class="volunteer-form" method="post">
                    <div class="form-group">
                        <label for="vol-name">Full Name</label>
                        <input type="text" id="vol-name" name="vol-name" required>
                    </div>

                    <div class="form-group">
                        <label for="vol-email">Email Address</label>
                        <input type="email" id="vol-email" name="vol-email" required>
                    </div>

                    <div class="form-group">
                        <label for="vol-phone">Phone Number</label>
                        <input type="tel" id="vol-phone" name="vol-phone" required>
                    </div>

                    <div class="form-group">
                        <label for="role">Preferred Role</label>
                        <select id="role" name="role" required>
                            <option value="">Select a role</option>
                            <option value="food-pantry">Food Pantry Support</option>
                            <option value="packing">Packing & Sorting</option>
                            <option value="delivery">Delivery Driver</option>
                            <option value="admin">Administration</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="hours">Hours available per week</label>
                        <input type="number" id="hours" name="hours" min="1" max="40" required>
                    </div>

                    <div class="form-group">
                        <label for="weeks">How many weeks are you available?</label>
                        <input type="number" id="weeks" name="weeks" min="1" max="52" required>
                    </div>

                    <button type="submit" class="btn-submit">Submit</button>
                </form>
            </div>

            <div class="volunteer-image-card">
                <img src="images/volunteer.jpg" alt="Volunteer helping in the community">
            </div>
        </section>
    </main>

    <div id="lightboxModal" class="lightbox-modal">
        <span class="lightbox-close">&times;</span>
        <img class="lightbox-content" id="lightboxImg" alt="Enlarged gallery view">
        <div id="lightboxCaption" class="lightbox-caption"></div>
    </div>

    <footer>
        <p>&copy; 2026 Hands of Hope. All rights reserved.</p>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
