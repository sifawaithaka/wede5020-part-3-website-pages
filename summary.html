<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Volunteer Registration Summary</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html"><img src="images/Hands of Hope Logo.jpg" alt="Hands of Hope Logo"></a>
            </div>
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="help.html">Ask for help</a></li>
                    <li><a href="donate.html">Donate</a></li>
                    <li><a href="volunteer.html">Get Involved</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <section class="summary-wrapper">
            <!-- Invoice-Style Container -->
            <div id="invoiceContainer" class="invoice-box">
                <!-- Content dynamically generated by JavaScript -->
            </div>
            
            <div class="summary-actions">
                <button onclick="window.print()" class="btn-submit">Print / Download PDF</button>
                <a href="volunteer.html" class="btn-secondary">Back to Volunteer Page</a>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Hands of Hope. All rights reserved.</p>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById("invoiceContainer");
            const rawData = sessionStorage.getItem("volunteerSummary");

            if (!rawData) {
                container.innerHTML = "<h2>No summary data found.</h2><p>Please complete a form on the <a href='volunteer.html'>Volunteer Page</a> or <a href='donate.html'>Donate Page</a> first.</p>";
                return;
            }

            const data = JSON.parse(rawData);

            // Render Donation Receipt if submitted from donate.html
            if (data.isDonation) {
                container.innerHTML = `
                    <div class="invoice-header">
                        <div>
                            <h1>DONATION STATEMENT</h1>
                            <p><strong>Hands of Hope NGO</strong> | Gauteng, South Africa</p>
                        </div>
                        <div class="invoice-ref">
                            <p><strong>Receipt #:</strong> ${data.refNumber}</p>
                            <p><strong>Date:</strong> ${data.submissionDate}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="invoice-details">
                        <div>
                            <h3>Donor Details</h3>
                            <p><strong>Name/Organization:</strong> ${data.name}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                        </div>
                        <div>
                            <h3>Impact Summary</h3>
                            <p><strong>Fund:</strong> ${data.donateType}</p>
                            <p><strong>Estimated Impact:</strong> ~${data.mealsProvided} Meals Provided</p>
                        </div>
                    </div>

                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th>Contribution Description</th>
                                <th>Fund Type</th>
                                <th>Amount (R)</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>Direct Financial Contribution</td>
                                <td>${data.donateType}</td>
                                <td><strong>R ${data.amount}</strong></td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="invoice-summary-box">
                        <h3>Thank You For Your Support!</h3>
                        <p>Your contribution directly supports food security initiatives across Gauteng. Hands of Hope is a recognized community initiative.</p>
                    </div>
                `;
            } else {
                // Volunteer Registration Statement
                container.innerHTML = `
                    <div class="invoice-header">
                        <div>
                            <h1>VOLUNTEER REGISTRATION STATEMENT</h1>
                            <p><strong>Hands of Hope NGO</strong> | Gauteng, South Africa</p>
                        </div>
                        <div class="invoice-ref">
                            <p><strong>Ref #:</strong> ${data.refNumber}</p>
                            <p><strong>Date:</strong> ${data.submissionDate}</p>
                        </div>
                    </div>
                    <hr>
                    <div class="invoice-details">
                        <div>
                            <h3>Volunteer Details</h3>
                            <p><strong>Name:</strong> ${data.name}</p>
                            <p><strong>Email:</strong> ${data.email}</p>
                            <p><strong>Phone:</strong> ${data.phone}</p>
                        </div>
                        <div>
                            <h3>Orientation Schedule</h3>
                            <p><strong>First Session:</strong> ${data.orientationDate}</p>
                            <p><strong>Location:</strong> 123 Hope Street, Johannesburg</p>
                        </div>
                    </div>

                    <table class="invoice-table">
                        <thead>
                            <tr>
                                <th>Description / Role</th>
                                <th>Weekly Hours</th>
                                <th>Duration</th>
                                <th>Total Hours</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${data.roleName}</td>
                                <td>${data.hoursPerWeek} hrs/wk</td>
                                <td>${data.totalWeeks} weeks</td>
                                <td><strong>${data.totalHours} hrs</strong></td>
                            </tr>
                        </tbody>
                    </table>

                    <div class="invoice-summary-box">
                        <h3>Calculated Impact Overview</h3>
                        <p><strong>Total Hours Committed:</strong> ${data.totalHours} Hours</p>
                        <p><strong>Estimated Community Meals Facilitated:</strong> ~${data.estimatedMealsServed} Meals</p>
                        <p><strong>Registration Fee:</strong> R0.00 (Free)</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
