<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Ask for Help</title>

    <!-- CSS link -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Headings -->
    <header class="header">
        <div class="logo">
            <img src="images/hands-of-hope-logo.png">
        </div>

        <!-- Navigation menu -->
        <header class="header">
            <div class="nav-container">
            <nav>
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="help.html">Ask for help</a></li>
                    <li><a href="donate.html">Donate</a></li>
                    <li><a href="volunteer.html">Get Involved</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
            </div>
        </header>
    

    <hr>

    <!-- Main Content Area -->
    <main class="main-container">
        <!-- Information Section -->
        <section class="emergency-banner">
            <p><strong>For emergencies contact:</strong> 011 123 4567</p>
        </section>

        <hr>

        <!-- Application Information -->
         <section class="form-container">
            <h1>Ask for help</h1>
            <p>Please fill out the form below to request assistance.</p>

            <form action="#" method="post">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="address">Physical Address / Area:</label>
                    <input type="text" id="address" name="address" placeholder="Enter your physical address" required>
                </div>

                <div class="form-group">
                    <label for="assistance-type">Type of Assistance Needed:</label>
                    <select id="assistance-type" name="assistance_type">
                        <option value="food">Food Parcels/Groceries</option>
                        <option value="clothing">Clothing Essentials</option>
                        <option value="disaster">Disaster / Emergency Relief</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="details">Additional Details:</label><br>
                    <textarea id="details" name="details" rows="5" placeholder="Provide any additional information about your request"></textarea><br><br>
                </div>

                <button type="submit">Submit Application</button>

            </form>
         </section>
    </main>

    <hr>

    <!-- Footer section -->
    <footer>
        <p>footer content here</p>
    </footer>
</body>
</html>
