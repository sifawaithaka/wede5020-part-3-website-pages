<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Help</title>
    <meta name="description" content="Apply for weekly food pantry support, emergency grocery packages, or financial assistance from Hands of Hope. We are here to support families.">

    <!-- CSS link -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <header class="site-header">
        <div class="nav-container">
            <div class="logo">
                <a href="index.html">
                    <img src="images/Hands of Hope Logo.jpg" alt="Hands of Hope Logo">
                </a>
            </div>
            <!-- Navigation menu -->
            <nav>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="help.html" class="active">Ask for help</a></li>
                    <li><a href="donate.html">Donate</a></li>
                    <li><a href="volunteer.html">Get Involved</a></li>
                    <li><a href="contact.html">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Emergency Contact Bar -->
    <div class="emergency-banner">
        <div class="banner-content">
            <p><strong>For emergencies contact:</strong> 011 123 4567</p>
        </div>
    </div>

    <!-- Main Form Section -->
    <main class="page-content">
        <section class="form-card">
            <h1>Applicant Details Form</h1>
            <p class="form-subtitle">Please fill out the form below to request assistance.</p>

            <form action="#" method="post" class="help-form">
                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>

                <div class="form-group">
                    <label for="address">Physical Address / Area:</label>
                    <input type="text" id="address" name="address" placeholder="Enter your physical address" required>
                </div>

                <div class="form-group">
                    <label for="assistance-type">Type of Assistance Needed:</label>
                    <select id="assistance-type" name="assistance_type">
                        <option value="food">Food Parcels/Groceries</option>
                        <option value="clothing">Clothing Essentials</option>
                        <option value="disaster">Disaster / Emergency Relief</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="details">Additional Details:</label>
                    <textarea id="details" name="details" rows="4" placeholder="Provide any additional information about your request"></textarea>
                </div>

                <button type="submit" class="btn-submit">Submit Application</button>
            </form>
        </section>
    </main>

    <!-- Footer section -->
    <footer>
        <p>&copy; 2026 Hands of Hope. All rights reserved.</p>
    </footer>
</body>
</html>
