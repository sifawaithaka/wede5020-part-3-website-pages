<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands of Hope | Ask for Help</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Headings -->
    <header>
        <div class="logo">
            <img src="images/hands-of-hope-logo.png">
        </div>
        <!-- Navigation menu -->
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="help.html">Ask for help</a></li>
                <li><a href="donate.html">Donate</a></li>
                <li><a href="volunteer.html">Get Involved</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <hr>

    <!-- Main Content Area -->
    <main>
        <!-- Information Section -->
        <section class="emergency">
            <h2>For Emergency Contact</h2>
            <p>If you need urgent food or disaster relief assistance, please reach out to our emergency team immediately.</p>
        </section>

        <hr>

        <!-- Assistance Request Form Section -->
        <section class="help-form">
            <h2>Applicant Details Form</h2>
            <form action="#" method="post">
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required><br><br>

                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required><br><br>

                <label for="address">Physical Address / Area:</label><br>
                <input type="text" id="address" name="address" required><br><br>

                <label for="assistance-type">Type of Assistance Needed:</label><br>
                <select id="assistance-type" name="assistance_type">
                    <option value="food">Food Parcel</option>
                    <option value="clothing">Clothing Essentials</option>
                    <option value="disaster">Disaster / Emergency Relief</option>
                </select><br><br>

                <label for="details">Additional Details:</label><br>
                <textarea id="details" name="details" rows="5"></textarea><br><br>

                <button type="submit">Submit Application</button>
            </form>
        </section>
    </main>

    <hr>

    <!-- Footer section -->
    <footer>
        <p>footer content here</p>
    </footer>
</body>
</html>
